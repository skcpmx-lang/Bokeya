name: build
on:
  push:
    branches: [arena/01a0779f-bokeya]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon
      - name: Assemble + test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDist 2>&1 | tee /tmp/build.log
      - name: Stage and verify Bokeya.apk
        id: verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SRC=$(find app/build/outputs/apk/dist -name '*.apk' | head -1)
          echo "build-tools: $BT" > /tmp/verify.txt
          if [ -z "$SRC" ]; then echo "NO APK PRODUCED" >> /tmp/verify.txt; cat /tmp/verify.txt; exit 1; fi
          mkdir -p /tmp/out && cp "$SRC" /tmp/out/Bokeya.apk
          APK=/tmp/out/Bokeya.apk
          echo "=== Bokeya.apk ($(stat -c%s $APK) bytes)" >> /tmp/verify.txt
          $BT/aapt2 dump badging "$APK" > /tmp/badging.txt 2>/dev/null
          grep -E "^package|^application-label|^sdkVersion|^targetSdkVersion|^launchable-activity" /tmp/badging.txt >> /tmp/verify.txt
          unzip -l "$APK" | grep -cE "classes.*\.dex" | sed 's/^/dex files: /' >> /tmp/verify.txt
          unzip -l "$APK" | grep -c "resources.arsc" | sed 's/^/resources.arsc: /' >> /tmp/verify.txt
          $BT/apksigner verify --print-certs "$APK" >> /tmp/verify.txt 2>&1
          SIGNED=$?
          echo "apksigner exit: $SIGNED" >> /tmp/verify.txt
          # Hard gates: right package, launchable, signed.
          grep -q "name='com.shohankhan.bokeya'" /tmp/badging.txt || { echo "GATE FAIL: package name" >> /tmp/verify.txt; cat /tmp/verify.txt; exit 1; }
          grep -q "launchable-activity" /tmp/badging.txt || { echo "GATE FAIL: no launcher activity" >> /tmp/verify.txt; cat /tmp/verify.txt; exit 1; }
          grep -q "INTERNET" /tmp/badging.txt && { echo "GATE FAIL: INTERNET permission present" >> /tmp/verify.txt; cat /tmp/verify.txt; exit 1; }
          [ $SIGNED -eq 0 ] || { echo "GATE FAIL: not signed" >> /tmp/verify.txt; cat /tmp/verify.txt; exit 1; }
          echo "ALL GATES PASSED" >> /tmp/verify.txt
          cat /tmp/verify.txt
      - name: Test summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' > /tmp/tests.txt
          import glob, xml.etree.ElementTree as ET
          t=f=s=0
          for p in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0))+int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for tc in r.iter('testcase'):
                  for bad in list(tc.iter('failure'))+list(tc.iter('error')):
                      print('FAILED:', tc.get('classname'), tc.get('name'))
                      print((bad.text or '')[:600])
          print(f'TOTAL tests={t} failures={f} skipped={s}')
          PY
          cat /tmp/tests.txt
      - name: Collect result
        if: always()
        run: |
          {
            echo "### exit: ${{ steps.build.outcome }}"
            echo "--- tests ---"
            cat /tmp/tests.txt 2>/dev/null | tail -60
            echo ""
            echo "--- apk verify ---"
            cat /tmp/verify.txt 2>/dev/null
            echo ""
            echo "--- errors ---"
            grep -nE "^e: |error:|FAILURE|Caused by|> Task .* FAILED|Execution failed|Unresolved reference" /tmp/build.log | head -80
            echo ""
            echo "--- tail ---"
            tail -30 /tmp/build.log
          } > /tmp/report.txt
          head -c 60000 /tmp/report.txt > /tmp/report_trim.txt
      - name: Report to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- run ${{ github.run_id }} -->'; echo '```'; cat /tmp/report_trim.txt; echo '```'; } > /tmp/body.md
          gh issue comment 1 --repo ${{ github.repository }} --body-file /tmp/body.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bokeya
          path: /tmp/out/Bokeya.apk
          if-no-files-found: warn
      - name: Publish release
        if: steps.build.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          gh release create v1.0.0 /tmp/out/Bokeya.apk \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "Bokeya 1.0.0" \
            --notes "বকেয়া (Bokeya) 1.0.0 — ধার, বকেয়া, কিস্তি ও আয়-ব্যয়ের হিসাব। সম্পূর্ণ offline।

          Download **Bokeya.apk** and install it directly. Package \`com.shohankhan.bokeya\`, minSdk 24."
      - name: Fail if build or verification failed
        if: steps.build.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
