name: build
on:
  push:
    branches: [arena/01a0779f-bokeya]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon
      - name: Assemble + test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee /tmp/build.log
      - name: Collect result
        if: always()
        run: |
          {
            echo "### exit: ${{ steps.build.outcome }}"
            echo "APKs:"
            find app/build/outputs -name '*.apk' -exec ls -la {} \; 2>/dev/null || echo none
            echo ""
            echo "--- errors ---"
            grep -nE "^e: |error:|FAILURE|Caused by|> Task .* FAILED|Execution failed|Unresolved reference|Could not|\.kt:[0-9]+" /tmp/build.log | head -120
            echo ""
            echo "--- tail ---"
            tail -60 /tmp/build.log
          } > /tmp/report.txt
          head -c 60000 /tmp/report.txt > /tmp/report_trim.txt
      - name: Report to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- run ${{ github.run_id }} -->'; echo '```'; cat /tmp/report_trim.txt; echo '```'; } > /tmp/body.md
          gh issue comment 1 --repo ${{ github.repository }} --body-file /tmp/body.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bokeya-apks
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
